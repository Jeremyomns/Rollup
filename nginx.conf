# =============================================================
# Rollup — configuration nginx (incluse dans le contexte http)
# Le routeur utilise le hash (#/...) : aucune règle de réécriture
# n'est nécessaire, tout part de index.html.
# =============================================================

# Politique de cache choisie selon l'extension demandée.
# On passe par une variable plutôt que par des `add_header` dans chaque
# bloc `location` : ainsi les en-têtes de sécurité définis au niveau
# `server` restent valables partout (add_header n'est pas cumulatif).
map $uri $rollup_cache_control {
    default                                  "no-cache, must-revalidate";
    ~*\.(?:svg|png|jpe?g|webp|ico|woff2?)$   "public, max-age=2592000, immutable";
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript text/javascript
                      application/json image/svg+xml application/manifest+json;

    # ---- En-têtes (application statique, sans backend) ----
    add_header Cache-Control          $rollup_cache_control always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header Referrer-Policy        "no-referrer"         always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Point de contrôle pour le healthcheck et le reverse proxy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Les fichiers de configuration éventuels ne sont pas servis
    location ~ /\. {
        deny all;
    }
}

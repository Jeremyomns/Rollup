# =============================================================
# Rollup — déploiement Docker
#   Local      : docker compose up -d --build   → http://localhost:8080
#   Dokploy    : type « Compose », ce fichier tel quel.
#                Le domaine est branché sur le service `rollup`, port 80.
# =============================================================
services:
  rollup:
    build:
      context: .
    image: rollup:latest
    container_name: rollup
    restart: unless-stopped
    ports:
      - "${ROLLUP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Durcissement : l'application est strictement en lecture seule.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
